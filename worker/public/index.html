<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自作Govbot（非公式）</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/chara-240.webp">
<meta name="description" content="総務省 Govbot の公開FAQデータを使い、個人が作った非公式の生成AI版。答えは FAQ の原文を引用して示します。">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><h1><img src="/chara-96.webp" alt="">自作Govbot<small>非公式</small></h1></header>

<main class="log" id="log" aria-live="polite">
  <div class="empty" id="empty"><img src="/chara-240.webp" alt="自作Govbot のキャラクター">知りたい手続きを入力してください<div class="chips" id="chips"></div></div>
</main>

<div class="composer">
  <form id="f">
    <textarea id="q" rows="1" maxlength="300" placeholder="質問を入力" aria-label="質問" required></textarea>
    <button id="go" type="submit">送信</button>
  </form>
  <footer>
    <p>総務省とは関係のない非公式サービスです。手続きは公式窓口でご確認ください。</p>
    <p>出典：<a href="https://www.soumu.go.jp/main_content/001102261.xlsx">総務省「Govbot FAQ データ」</a>（令和8年11月19日時点）を加工 ／ 質問は記録されます。個人情報は入力しないでください。</p>
  </footer>
</div>
<script src="/app.js" defer></script>
</body>
</html>
